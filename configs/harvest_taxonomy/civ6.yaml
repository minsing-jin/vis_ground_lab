# Active routing-only taxonomy for Civ6.
# This file is the source of truth for primitive routing labels.
#
# Active fields used by harvest:
# - profile.screen_types
# - primitives[].id / router_enabled / criteria / candidate_situations
# - primitives[].must_have_visuals / strong_cues / hard_negatives
# - situations[].id / allowed_primitives / screen_types / roi_priority / trigger_cues
# - rois[].id / norm_xyxy
#
# ROI coordinates are normalized against the captured frame.
# Resolution changes are okay. Random window move/resize is not.
---
profile:
  name: civ6
  display_name: Civilization VI
  screen_types:
    - main_map
    - popup
    - tech_tree
    - civic_tree
    - city_view
    - diplomacy
    - city_state_screen
    - government
    - religion_screen
    - governor_screen
    - world_congress
    - era_screen
    - deal_screen
    - war_screen
    - loading
    - main_menu

primitives:
  - id: religion_primitive
    router_enabled: true
    criteria: 종교관 선택 화면. 종교관 목록 또는 '종교관 세우기' 버튼 표시.
    candidate_situations:
      - religion_choice_visible
    requires_open_screen: true
    must_have_visuals:
      - 종교관 후보 목록 또는 카드 리스트가 실제로 열려 있음
      - 종교관 세우기 확정 버튼이 보임
    strong_cues:
      - 종교관 이름과 효과 설명 텍스트가 반복적으로 보임
      - 일반 도시/연구/정책 화면과 다른 종교 전용 레이아웃
    hard_negatives:
      - 우하단 종교 관련 진입 아이콘만 보이고 목록이 안 열려 있음
      - 정책 카드 슬롯 구조가 보임
      - 기술 트리 또는 생산 목록이 열려 있음
    entry_button_falls_back_to: popup_primitive

  - id: governor_primitive
    router_enabled: true
    criteria: 총독 카드 나열 또는 '총독 배정' 텍스트 표시. 총독 임명 팝업 포함.
    candidate_situations:
      - governor_management_visible
    requires_open_screen: true
    must_have_visuals:
      - 총독 카드 또는 초상화 목록이 보임
      - 총독 배정 텍스트 또는 배정 버튼이 보임
    strong_cues:
      - 임명 또는 진급 버튼이 총독 카드와 함께 보임
      - 도시 배정 패널과 초록색 배정 버튼이 함께 보임
    hard_negatives:
      - 정책 카드 슬롯과 드래그 구조만 보임
      - 일반 확인 팝업만 보이고 총독 카드가 없음
    entry_button_falls_back_to: popup_primitive

  - id: voting_primitive
    router_enabled: true
    criteria: 세계의회 투표 화면. 정책 A/B 선택, 찬성/반대 기호, 합의안 투표.
    candidate_situations:
      - world_congress_vote_visible
    requires_open_screen: true
    must_have_visuals:
      - 안건 블록이 2개 이상 보임
      - 각 안건에 A/B 선택 또는 찬성/반대 UI가 있음
    strong_cues:
      - 대상 선택용 버튼 또는 라디오 버튼이 보임
      - 게임으로 돌아가기 또는 제출 버튼이 보일 수 있음
    hard_negatives:
      - 도시국가 사절 파견용 화살표 버튼 구조임
      - 정책 카드 슬롯 관리 화면임
    entry_button_falls_back_to: popup_primitive

  - id: era_primitive
    router_enabled: true
    criteria: 시대 전략 선택 화면. 시대 헌신 4개 박스 표시, 확정 버튼.
    candidate_situations:
      - era_dedication_visible
    requires_open_screen: true
    must_have_visuals:
      - 시대 헌신 후보 박스가 크게 4개 내외로 보임
      - 하단 또는 우측에 확정 버튼이 보임
    strong_cues:
      - 시대 전환 전용 레이아웃이며 정책 카드 슬롯 구조가 아님
      - 박스들이 큰 독립 패널 형태임
    hard_negatives:
      - 정책 카드 슬롯 관리 화면임
      - 종교관 세로 리스트형 화면임
      - 일반 단일 팝업만 보임
    entry_button_falls_back_to: popup_primitive

  - id: unit_ops_primitive
    router_enabled: true
    criteria: 유닛 선택됨 (우하단 유닛정보). 이동/정착/개선/정찰 같은 비전투 일반 조작 필요.
    candidate_situations:
      - noncombat_unit_ops_visible
    requires_open_screen: false
    must_have_visuals:
      - 메인 맵 화면에서 선택된 유닛 패널이 보임
      - 전용 전체화면 UI가 열려 있지 않음
    strong_cues:
      - 이동 가능한 하늘색 육각 타일
      - 정착, 개선, 정찰 같은 일반 유닛 조작 맥락
    hard_negatives:
      - 적 유닛 또는 적 도시가 즉시 공격 가능한 위치에서 HP 정보가 핵심임
      - 정책, 연구, 생산, 외교, 총독, 투표 같은 전용 화면이 열려 있음
    entry_button_falls_back_to:

  - id: research_select_primitive
    router_enabled: true
    criteria: 연구 선택 팝업 표시 또는 기술 트리 화면 열림. 기술 목록/노드 보임.
    candidate_situations:
      - research_selection_screen_open
    requires_open_screen: true
    must_have_visuals:
      - 기술 트리 또는 기술 후보 목록이 실제로 열려 있음
      - 여러 기술 노드, 카드, 연결선, 목록 중 하나 이상이 보임
    strong_cues:
      - 과학/플라스크 계열 시각 요소
      - 일부 기술이 잠금/완료/선택 가능 상태로 구분됨
    hard_negatives:
      - 우하단 파란 플라스크 진입 버튼만 보이고 기술 목록은 안 열려 있음
      - 사회 제도 트리 화면임
    entry_button_falls_back_to: popup_primitive

  - id: city_production_primitive
    router_enabled: true
    criteria: 생산 품목 선택 팝업 표시. 건물/유닛 목록 보임.
    candidate_situations:
      - city_production_screen_open
    requires_open_screen: true
    must_have_visuals:
      - 생산 품목 리스트 또는 생산 패널이 실제로 열려 있음
      - 건물, 유닛, 지구, 불가사의 항목과 턴 수/상태가 보임
    strong_cues:
      - 밝은 활성 항목과 어두운 비활성 항목 구분
      - 지구/불가사의 배치 시 초록 육각형 타일이 보일 수 있음
    hard_negatives:
      - 우하단 오렌지 생산 버튼만 보임
      - 기술 트리 또는 정책 카드 슬롯 구조임
    entry_button_falls_back_to: popup_primitive

  - id: culture_decision_primitive
    router_enabled: true
    criteria: 사회 제도 트리 화면 열림. 사회 제도 노드 트리 형태.
    candidate_situations:
      - civic_selection_screen_open
    requires_open_screen: true
    must_have_visuals:
      - 사회 제도 트리 또는 사회 제도 후보 목록이 실제로 열려 있음
      - 제도 노드, 분기, 연결 구조 또는 목록이 보임
    strong_cues:
      - 문화/사회 제도 전용 시각 요소
      - 영감, 완료, 잠금 상태가 구분된 제도들이 보임
    hard_negatives:
      - 우하단 사회 제도 선택 진입 버튼만 보임
      - 정책 카드 슬롯 관리 화면임
      - 기술 트리 화면임
    entry_button_falls_back_to: popup_primitive

  - id: diplomatic_primitive
    router_enabled: true
    criteria: 외교 화면. 도시국가 사절파견 또는 외교 상호작용.
    candidate_situations:
      - diplomatic_envoy_screen_open
    requires_open_screen: true
    must_have_visuals:
      - 도시국가 또는 외교 전용 패널이 열려 있음
      - 사절 파견 화살표 버튼 또는 도시국가 목록이 보임
    strong_cues:
      - 오른쪽 또는 측면 패널에 도시국가 이름들이 나열됨
      - 사절 파견 버튼이 반복적으로 보임
    hard_negatives:
      - 세계의회 A/B 안건 투표 구조임
      - 자원/골드 거래창 구조임
      - 일반 단일 팝업만 보임
    entry_button_falls_back_to: popup_primitive

  - id: combat_primitive
    router_enabled: true
    criteria: 전투 유닛이 적 인접. 공격/방어 결정 필요.
    candidate_situations:
      - combat_decision_visible
    requires_open_screen: false
    must_have_visuals:
      - 메인 맵에서 선택된 군사 유닛이 보임
      - 적 유닛 또는 적 도시가 즉시 공격 가능한 위치에 있음
      - 전투 판단에 필요한 HP 바 또는 적 목표 정보가 시각적으로 핵심임
    strong_cues:
      - 공격 범위 내 적 배치
      - 방어 또는 후퇴를 바로 결정해야 하는 장면
    hard_negatives:
      - 단순 이동 가능한 육각 타일과 일반 유닛 조작 장면임
      - 적이 멀리 있어 즉시 전투가 성립하지 않음
      - 전용 전체화면 UI가 열려 있음
    entry_button_falls_back_to:

  - id: policy_primitive
    router_enabled: true
    criteria: 사회제도 완성/정책변경 팝업, 새 정부 선택 화면, 또는 정부/정책 카드 배정 화면.
    candidate_situations:
      - policy_or_government_screen_open
    requires_open_screen: true
    must_have_visuals:
      - 정책변경 팝업 또는 정부 선택 화면 또는 정책 카드 슬롯 관리 화면이 보임
      - 슬롯, 카드 목록, 탭, 모든 정책 배정 버튼 중 일부가 보임
    strong_cues:
      - 빨강/노랑/외교/와일드카드 탭
      - 카드 드래그앤드롭 구조
      - 정부 카드 선택 레이아웃
    hard_negatives:
      - 일반 확인 팝업이며 정책변경/정부/정책 카드 UI가 없음
      - 사회 제도 트리 화면임
    entry_button_falls_back_to:

  - id: popup_primitive
    router_enabled: true
    criteria: 전용 선택 화면은 열리지 않았고, 일반 팝업 또는 우하단 진입 버튼만 보임.
    candidate_situations:
      - generic_popup_or_entry_prompt_visible
    requires_open_screen: false
    must_have_visuals:
      - 전용 전체화면 UI가 열려 있지 않음
      - 일반 확인/수락/esc 닫기 성격의 팝업 또는 우하단 진입 버튼만 보임
    strong_cues:
      - 다음 턴
      - 연구 선택
      - 생산 품목
      - 사회 제도 선택
    hard_negatives:
      - 기술 목록 또는 기술 트리가 열려 있음
      - 생산 품목 리스트가 열려 있음
      - 사회 제도 트리가 열려 있음
      - 정부/정책 카드 슬롯 관리 화면이 열려 있음
      - 총독 카드가 열려 있음
      - 종교관 목록이 열려 있음
      - 세계의회 안건 블록이 보임
    entry_button_falls_back_to:

  - id: war_primitive
    router_enabled: true
    criteria: 전쟁 선포 버튼과 빨간 최종 확인 버튼이 보이는 전쟁 선포 화면.
    candidate_situations:
      - war_declaration_screen_open
    requires_open_screen: true
    must_have_visuals:
      - 전쟁 선포 관련 메뉴가 실제로 열려 있음
      - 전쟁 선포 버튼과 빨간 최종 확인 버튼이 보임
    strong_cues:
      - 대표 반응 화면 또는 외교 대면 화면이 이어질 수 있음
    hard_negatives:
      - 일반 외교 화면 또는 거래 화면이며 전쟁 버튼이 보이지 않음
      - 단일 일반 팝업만 보임
    entry_button_falls_back_to:

  - id: deal_primitive
    router_enabled: true
    criteria: 자원/골드/GPT를 조절하고 거래수락 버튼이 보이는 거래 화면.
    candidate_situations:
      - deal_negotiation_screen_open
    requires_open_screen: true
    must_have_visuals:
      - 거래 화면이 실제로 열려 있음
      - 내가 줄 것/상대가 줄 것/골드/GPT 조절 UI가 보임
      - 거래수락 버튼이 보임
    strong_cues:
      - 좌우 또는 상하로 자원 교환 항목이 구분됨
      - 사치자원, 전략자원, 일시불 골드, 턴당 골드 항목
    hard_negatives:
      - 도시국가 사절 파견 화면임
      - 일반 외교 대화창이며 거래 항목 리스트가 없음
      - 단일 일반 팝업만 보임
    entry_button_falls_back_to:

situations:
  - id: religion_choice_visible
    description: 종교관 후보 목록과 종교관 세우기 버튼이 실제로 열린 종교 선택 화면.
    screen_types: [popup, religion_screen]
    allowed_primitives: [religion_primitive]
    roi_priority: [popup_center]
    trigger_cues: [종교관 세우기, 종교관, belief]

  - id: governor_management_visible
    description: 총독 카드/임명·진급 버튼/총독 배정 텍스트/배정 버튼이 보이는 총독 관리 화면.
    screen_types: [popup, governor_screen, main_map]
    allowed_primitives: [governor_primitive]
    roi_priority: [popup_center, left_panel]
    trigger_cues: [총독 배정, 임명, 진급, 배정]

  - id: world_congress_vote_visible
    description: 세계의회 안건 블록, A/B 선택, 찬반 아이콘, 대상 선택 버튼이 보이는 투표 화면.
    screen_types: [world_congress, popup]
    allowed_primitives: [voting_primitive]
    roi_priority: [popup_center]
    trigger_cues: [세계의회, 정책 A/B, upvote, downvote]

  - id: era_dedication_visible
    description: 시대 헌신 4개 박스와 확정 버튼이 보이는 시대 전략 선택 화면.
    screen_types: [popup, era_screen]
    allowed_primitives: [era_primitive]
    roi_priority: [popup_center]
    trigger_cues: [시대 전략, 시대 헌신, 확정]

  - id: noncombat_unit_ops_visible
    description: 전용 UI 없이 메인 맵에서 선택 유닛의 이동·정착·개선·정찰을 판단하는 일반 유닛 조작 화면.
    screen_types: [main_map]
    allowed_primitives: [unit_ops_primitive]
    roi_priority: [unit_panel, main_map]
    trigger_cues: [유닛정보, 이동, 정착, 개선, 정찰]

  - id: research_selection_screen_open
    description: 기술 트리 또는 기술 후보 목록이 실제로 열린 연구 선택 화면.
    screen_types: [tech_tree, popup, main_map]
    allowed_primitives: [research_select_primitive]
    roi_priority: [popup_center, bottom_right]
    trigger_cues: [연구 선택, 기술 트리, tech tree, 과학]

  - id: city_production_screen_open
    description: 건물/유닛/지구/불가사의 생산 목록과 턴 수가 보이는 도시 생산 선택 화면.
    screen_types: [city_view, popup, main_map]
    allowed_primitives: [city_production_primitive]
    roi_priority: [popup_center, main_map, unit_panel]
    trigger_cues: [생산 품목, production, 건물, 유닛, 턴]

  - id: civic_selection_screen_open
    description: 사회 제도 트리 또는 제도 후보 목록이 실제로 열린 사회 제도 선택 화면.
    screen_types: [civic_tree, popup, main_map]
    allowed_primitives: [culture_decision_primitive]
    roi_priority: [popup_center, bottom_right]
    trigger_cues: [사회 제도, civic, 문화, 영감]

  - id: diplomatic_envoy_screen_open
    description: 도시국가 목록과 사절 파견 화살표 버튼이 보이는 외교 화면.
    screen_types: [diplomacy, city_state_screen, popup]
    allowed_primitives: [diplomatic_primitive]
    roi_priority: [popup_center, top_bar]
    trigger_cues: [외교, 도시국가, 사절, 화살표]

  - id: combat_decision_visible
    description: 선택된 군사 유닛이 적 유닛/도시를 즉시 공격할 수 있어 전투 판단이 필요한 화면.
    screen_types: [main_map]
    allowed_primitives: [combat_primitive]
    roi_priority: [unit_panel, main_map]
    trigger_cues: [적 인접, 공격, 체력, 전투]

  - id: policy_or_government_screen_open
    description: 정책변경 팝업, 새 정부 선택, 정책 슬롯, 정책 카드 목록, 모든 정책 배정 버튼이 보이는 정책 관리 화면.
    screen_types: [government, popup]
    allowed_primitives: [policy_primitive]
    roi_priority: [popup_center]
    trigger_cues: [정책변경, 정부, 정책 카드, 모든 정책 배정]

  - id: generic_popup_or_entry_prompt_visible
    description: 전용 선택 화면은 열리지 않았고, 다음 턴/연구 선택/생산 품목/사회 제도 선택 같은 진입 버튼이나 일반 확인 팝업만 보이는 화면.
    screen_types: [main_map, popup]
    allowed_primitives: [popup_primitive]
    roi_priority: [bottom_right, popup_center]
    trigger_cues: [다음 턴, 연구 선택, 생산 품목, 사회 제도 선택, 확인]

  - id: war_declaration_screen_open
    description: 기습전쟁선포/전쟁선포 버튼과 빨간 최종 확인 버튼이 보이는 전쟁 선포 화면.
    screen_types: [diplomacy, popup, war_screen]
    allowed_primitives: [war_primitive]
    roi_priority: [popup_center]
    trigger_cues: [전쟁 선포, 기습전쟁선포, 빨간 버튼]

  - id: deal_negotiation_screen_open
    description: 자원/골드/GPT를 조정하고 거래수락 버튼이 보이는 거래 화면.
    screen_types: [diplomacy, deal_screen]
    allowed_primitives: [deal_primitive]
    roi_priority: [popup_center]
    trigger_cues: [거래, 거래 수락, 골드, GPT, 자원]

