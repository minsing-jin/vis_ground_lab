# Actionable UI element ontology.
#
# Required:
# - id
# - display_name
# - function_id_or_related_primitive
# - available_actions
# - roi_hint
#
# This file does not need to be complete on day 1.
# Add only stable and review-relevant semantics first.

- id: btn_end_turn
  display_name: End Turn / Next Turn button
  function_id_or_related_primitive: popup_primitive
  text_aliases:
    - End Turn
    - Next Turn
  icon_aliases: []
  available_actions:
    - click
    - press
  hotkeys:
    - SHIFT+ENTER
  roi_hint: bottom_right
  default_enabled_state: enabled
  review_notes: "Use for the clickable bottom-right turn advance control."

