# Page-level routing situations.
#
# Required:
# - id
# - description
# - screen_types
# - allowed_primitives
#
# Recommended:
# - trigger_cues: visible text/icons/layout hints that should trigger this label
# - target_semantic_ids: likely clickable targets in this state
# - exit_cues: how you know the state has finished

- id: popup_visible
  description: Generic popup or urgent bottom-right prompt is visible and requires handling.
  screen_types:
    - main_map
    - popup
  allowed_primitives:
    - popup_primitive
  disallowed_primitives:
    - war_primitive
    - deal_primitive
  roi_priority:
    - bottom_right
    - popup_center
  trigger_cues:
    - Blocking popup with confirm/close affordance
    - Bottom-right urgent action prompt
  target_semantic_ids:
    - btn_accept_popup
    - btn_close_popup
    - btn_end_turn
    - btn_choose_research
    - btn_choose_production
    - btn_choose_civic
  exit_cues:
    - Popup disappears
    - Prompt changes to another page-specific chooser
  review_notes: "Fallback only. Prefer a more specific popup situation when possible."

- id: confirm_accept_popup
  description: A confirmation popup with an affirmative action is visible.
  screen_types:
    - popup
  allowed_primitives:
    - popup_primitive
  disallowed_primitives:
    - war_primitive
    - deal_primitive
  roi_priority:
    - popup_center
  trigger_cues:
    - 확인
    - 수락
    - 예
    - Continue
  target_semantic_ids:
    - btn_accept_popup
    - btn_cancel_popup
  exit_cues:
    - Confirmation popup disappears
  review_notes: "Use when POPUP_PROMPT rule says enter/accept rather than esc."

- id: informational_popup
  description: An informational popup is visible and can be dismissed without choosing among competing actions.
  screen_types:
    - popup
  allowed_primitives:
    - popup_primitive
  disallowed_primitives: []
  roi_priority:
    - popup_center
  trigger_cues:
    - Single dismiss or close interaction
    - No strategic branching choice needed
  target_semantic_ids:
    - btn_close_popup
  exit_cues:
    - Popup disappears after esc or close
  review_notes: "Use for info-only alerts, summaries, or completed-notification popups."

