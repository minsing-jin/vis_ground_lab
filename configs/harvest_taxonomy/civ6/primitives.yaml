# Stable primitive registry.
#
# Use this file only for primitives that are stable enough to train/export.
# Match the shape of your runtime PRIMITIVE_REGISTRY.
#
# Required:
# - id
# - router_enabled
# - criteria
# - prompt_ref
# - priority
# - multi_step
# - max_steps
# - completion_condition

- id: popup_primitive
  router_enabled: true
  hitl_only: false
  criteria: "팝업 표시됨. 또는 우하단에 '다음 턴'/'연구 선택'/'생산 품목' 버튼 보임."
  prompt_ref: POPUP_PROMPT
  priority: 1
  multi_step: false
  max_steps: 1
  completion_condition: ""
  candidate_situations:
    - popup_visible
    - confirm_accept_popup
    - informational_popup
    - governor_jump_popup
    - policy_change_prompt
    - next_turn_ready
    - research_prompt_visible
    - research_selection_open
    - production_prompt_visible
    - city_production_open
    - civic_prompt_visible
  related_semantic_ids:
    - btn_end_turn
    - btn_choose_research
    - btn_choose_production
    - btn_choose_civic
    - btn_open_governor_screen
    - btn_policy_change
    - btn_accept_popup
    - btn_close_popup
  review_notes: >
    Use as the generic router class for urgent popup-or-prompt handling.

