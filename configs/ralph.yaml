harvest_config_path: configs/harvest.yaml
output_dir: runs/ralph
judgments_path: runs/ralph/judgments.jsonl
preferences_path: runs/ralph/preferences.jsonl
metrics_path: runs/ralph/metrics.jsonl

judge:
  vlm_model_name: "microsoft/Florence-2-large"
  vlm_device_map: "auto"
  vlm_weight: 0.6
  heuristic_weight: 0.4
  vlm_prompts:
    - "detect the UI element"
    - "detect the clickable button"
  min_bbox_area_ratio: 0.001
  max_bbox_area_ratio: 0.5
  max_aspect_ratio: 10.0

weight_tuner:
  n_samples: 50
  n_trials: 30
  timeout_seconds: 180

dpo:
  method: sft                       # "dpo" or "sft" (sft fallback when trl unavailable)
  base_model_name: "microsoft/Florence-2-base"
  learning_rate: 5e-5
  batch_size: 4
  epochs: 1
  checkpoint_dir: checkpoints/ralph
  use_lora: true
  lora_r: 16
  lora_alpha: 32

loop:
  max_iterations: 5
  patience: 3
  improvement_threshold: 0.01
  run_dpo: true
  run_weight_tuning: true
