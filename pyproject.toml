[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "myvg"
version = "0.1.0"
description = "Local-first visual grounding training framework for UI automation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "vis_ground_lab" }]
dependencies = [
  "torch>=2.2.0",
  "transformers>=4.40.0",
  "peft>=0.10.0",
  "datasets>=2.18.0",
  "einops>=0.7.0",
  "timm>=0.9.16",
  "typer>=0.12.0",
  "pydantic>=2.6.0",
  "PyYAML>=6.0.1",
  "Pillow>=10.0.0",
  "huggingface_hub>=0.22.0",
]

[project.scripts]
myvg = "vis_ground_lab.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
